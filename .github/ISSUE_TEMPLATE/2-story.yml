name: Story
description: One user-facing change, small enough to finish and ship.
title: ""
type: Story
projects: ["kasaia-portal/1"]
body:
  - type: markdown
    attributes:
      value: |
        Open the story in the repo its commits will land in. If it belongs to an epic, add it as a sub-issue there ("Relationships → Add parent"). Commits reference it with `Refs #N`, and the last one with `Fixes #N`. Write in plain English.
  - type: textarea
    id: before-after
    attributes:
      label: Before and after
      description: What a user (resident, admin, superadmin) experiences today, and what they will experience once this ships. Name screens, messages and behavior, not code, so anyone can tell what changes.
      value: |
        **Before:**

        **After:**
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why this is needed, the problem and who it affects. Technical detail belongs here.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What changes. If it needs commits in another repo, say so; that part becomes a sub-issue.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable, testable outcomes.
      value: |
        -
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: Tests
      description: How it will be verified.
  - type: textarea
    id: follow-ups
    attributes:
      label: Follow-ups
      description: Out of scope, noted for later.
